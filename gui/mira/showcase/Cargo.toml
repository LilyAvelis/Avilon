[package]
name = "avilon-mira-showcase"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
default-run = "mira-atlas"

[lib]
name = "mira"

[dependencies]
avilon-actions = { path = "../../../crates/avilon-actions" }
avilon-egui = { path = "../../../crates/avilon-egui" }
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Media_Audio", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
